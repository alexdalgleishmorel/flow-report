name: Fetch, Build, and Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  updateDataBuildAndDeploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Checkout to production branch
        run: |
          git fetch
          git checkout production
      
      - name: Fetch data from TransAlta API and Weather API
        run: |
          # Validate each response as JSON before overwriting the committed file.
          # A non-JSON body (e.g. an HTML error page) gets discarded so it can't
          # poison the repo and break the tsc build.
          fetch_json() {
            local dest="$1"; shift
            local tmp; tmp=$(mktemp)
            if curl --silent --show-error "$@" -o "$tmp" && jq -e . "$tmp" > /dev/null 2>&1; then
              mv "$tmp" "$dest"
            else
              echo "::warning::$dest fetch returned invalid JSON; keeping previous version"
              rm -f "$tmp"
            fi
          }

          fetch_json ./src/flowData.json --max-time 600 --retry 3 --retry-delay 10 --retry-connrefused --retry-all-errors --fail 'https://azf-eai-denodo-proxies.azurewebsites.net/api/riverflow'
          fetch_json ./src/weatherData.json 'https://api.open-meteo.com/v1/forecast?latitude=51.051798892149094&longitude=-115.0190595210664&hourly=temperature_2m&daily=sunrise,sunset&timezone=America%2FDenver'

          # rivers.alberta.ca uses ASP.NET MVC anti-forgery (double-submit token):
          # GET the root page to receive the __RequestVerificationToken cookie + a
          # matching hidden form field, then POST with both. If extraction fails
          # the POST still fires (without a token) and fetch_json's JSON guard
          # rejects the HTML error response, preserving the previous file.
          rivers_jar=$(mktemp)
          rivers_html=$(mktemp)
          curl --silent --show-error --max-time 60 -c "$rivers_jar" -o "$rivers_html" 'https://rivers.alberta.ca/' || true
          rivers_token=$(grep -oE 'name="__RequestVerificationToken"[^>]*value="[^"]+"' "$rivers_html" | sed -E 's/.*value="([^"]+)".*/\1/' | head -1)
          rm -f "$rivers_html"

          fetch_json ./src/historicalFlowData.json -b "$rivers_jar" -X POST 'https://rivers.alberta.ca/DataService/WaterlevelRecords' --data-urlencode 'stationNumber=05BF024' --data-urlencode 'stationType=L' --data-urlencode 'dataType=HG' --data-urlencode "__RequestVerificationToken=$rivers_token"
          rm -f "$rivers_jar"
      
      - name: Commit and push if there are changes
        run: |
          git config --global user.email "alex.dalgleishmorel@gmail.com"
          git config --global user.name "alexdalgleishmorel"
          git add ./src/flowData.json ./src/weatherData.json ./src/historicalFlowData.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update data" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Dependencies
        run: npm install
      
      - name: Build and Deploy
        run: |
          git config --global user.email "alex.dalgleishmorel@gmail.com"
          git config --global user.name "alexdalgleishmorel"
          git remote set-url origin https://alexdalgleishmorel:${{ secrets.GITHUB_TOKEN }}@github.com/alexdalgleishmorel/flow-report.git
          npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
